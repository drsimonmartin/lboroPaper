title: Loughborough Committee Paper
author: Loughborough University
version: 0.6.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    docx:
      reference-doc: word/reference.docx
      toc: false
      number-sections: false
      filters:
        - lboro-paper.lua
    pdf:
      documentclass: article
      papersize: a4
      toc: false
      number-sections: false
      geometry:
        - top=10mm
        - bottom=10mm
        - left=15mm
        - right=15mm
      fontsize: 12pt
      linestretch: 1.5
      colorlinks: true
      include-in-header: pdf/preamble.tex
      filters:
        - lboro-paper.lua
